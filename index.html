# AI-quiz-generator1

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Generator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #001f5c, #008cff);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.container {
    background: #ffffff;
    color: #123;
    width: 100%;
    max-width: 600px;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px #001b4d88;
}

h1 {
    text-align: center;
    color: #0066cc;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #555;
    margin-bottom: 25px;
}

.top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    color: #0066cc;
    font-weight: bold;
}

#question {
    font-size: 21px;
    margin-bottom: 20px;
    color: #123;
}

.option {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 2px solid #c9e2ff;
    border-radius: 10px;
    background: #f4f9ff;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
    transition: 0.2s;
}

.option:hover:not(:disabled) {
    background: #dceeff;
    border-color: #007bff;
}

.option:disabled {
    cursor: default;
}

.correct {
    background: #c8f7d2;
    border-color: green;
}

.wrong {
    background: #ffd4d4;
    border-color: red;
}

button {
    background: #007bff;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
    width: 100%;
}

button:hover {
    background: #0056b3;
}

#result {
    text-align: center;
    display: none;
}

#result h2 {
    color: #0066cc;
    margin-bottom: 15px;
}

#progress {
    height: 9px;
    background: #ddd;
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
}

#bar {
    height: 100%;
    width: 0%;
    background: #007bff;
    transition: 0.3s;
}
</style>
</head>

<body>

<div class="container">

    <h1>🧠 AI Quiz Generator</h1>
    <p class="subtitle">Test Your Science Knowledge!</p>

    <div id="quiz">

        <div class="top">
            <span id="count">Question 1/10</span>
            <span id="score">Score: 0</span>
        </div>

        <div id="progress">
            <div id="bar"></div>
        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button id="next" onclick="nextQuestion()" disabled>
            Next Question →
        </button>

    </div>

    <div id="result">
        <h2>🎉 Quiz Completed!</h2>
        <h3 id="finalScore"></h3>
        <p id="message"></p>
        <button onclick="restartQuiz()">Play Again 🔄</button>
    </div>

</div>

<script>

const questions = [
{
q: "Which planet is known as the Red Planet?",
options: ["Earth", "Mars", "Jupiter", "Venus"],
answer: 1
},
{
q: "Which gas do plants absorb?",
options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"],
answer: 2
},
{
q: "What is the chemical formula of water?",
options: ["CO2", "H2O", "O2", "NaCl"],
answer: 1
},
{
q: "Which organ pumps blood in the human body?",
options: ["Brain", "Lungs", "Heart", "Kidney"],
answer: 2
},
{
q: "What is the nearest star to Earth?",
options: ["Sirius", "Sun", "Polaris", "Vega"],
answer: 1
},
{
q: "How many bones are there in an adult human body?",
options: ["206", "300", "150", "250"],
answer: 0
},
{
q: "Which part of a plant absorbs water?",
options: ["Leaves", "Flowers", "Roots", "Fruits"],
answer: 2
},
{
q: "What force pulls objects toward Earth?",
options: ["Friction", "Gravity", "Magnetism", "Electricity"],
answer: 1
},
{
q: "Which vitamin is produced in the skin with sunlight exposure?",
options: ["Vitamin A", "Vitamin B12", "Vitamin C", "Vitamin D"],
answer: 3
},
{
q: "Which is the largest planet in our solar system?",
options: ["Earth", "Saturn", "Jupiter", "Mars"],
answer: 2
}
];

let current = 0;
let score = 0;
let answered = false;

function loadQuestion() {

    answered = false;

    document.getElementById("next").disabled = true;

    let q = questions[current];

    document.getElementById("count").innerText =
        `Question ${current + 1}/10`;

    document.getElementById("score").innerText =
        `Score: ${score}`;

    document.getElementById("question").innerText = q.q;

    document.getElementById("bar").style.width =
        (current / questions.length * 100) + "%";

    let options = document.getElementById("options");
    options.innerHTML = "";

    q.options.forEach((option, index) => {

        let btn = document.createElement("button");

        btn.className = "option";
        btn.innerText = String.fromCharCode(65 + index) + ". " + option;

        btn.onclick = () => checkAnswer(index, btn);

        options.appendChild(btn);

    });
}

function checkAnswer(index, button) {

    if (answered) return;

    answered = true;

    let correct = questions[current].answer;
    let buttons = document.querySelectorAll(".option");

    buttons.forEach((btn, i) => {
        btn.disabled = true;

        if (i === correct) {
            btn.classList.add("correct");
        }
    });

    if (index === correct) {
        score++;
    } else {
        button.classList.add("wrong");
    }

    document.getElementById("score").innerText =
        `Score: ${score}`;

    document.getElementById("next").disabled = false;
}

function nextQuestion() {

    current++;

    if (current < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("finalScore").innerText =
        `Your Score: ${score}/10`;

    let message = score >= 8
        ? "Excellent! Amazing Science Knowledge! 🏆"
        : score >= 5
        ? "Good Job! Keep Learning! 👍"
        : "Keep Practicing! You Can Do It! 💪";

    document.getElementById("message").innerText = message;

    document.getElementById("bar").style.width = "100%";
}

function restartQuiz() {

    current = 0;
    score = 0;

    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
